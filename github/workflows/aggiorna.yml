# Tabellone Carburanti — aggiornamento quotidiano e pubblicazione su GitHub Pages.
#
# Ogni mattina: prova del motore → acquisizione dati MIMIT → archiviazione di
# data/prezzi.json nel repository → pubblicazione del sito.
# Gli orari cron sono in UTC: 08:47 e 11:47 UTC corrispondono alle 10:47 e
# 13:47 con l'ora legale, alle 9:47 e 12:47 con l'ora solare. La seconda
# esecuzione recupera il caso in cui la pagina MIMIT sia aggiornata in ritardo.
#
# Autore: Biagio Raucci — Licenza MIT.

name: Aggiorna tabellone

on:
  schedule:
    - cron: "47 8,11 * * *"
  workflow_dispatch:        # pulsante "Run workflow" nella scheda Actions
  push:
    branches: [main]        # ogni modifica caricata ripubblica il sito

permissions:
  contents: write           # per archiviare data/prezzi.json
  pages: write              # per pubblicare su GitHub Pages
  id-token: write

concurrency:
  group: tabellone
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pubblica.outputs.page_url }}
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v5

      - name: Prova il motore (nessuna rete)
        run: |
          python3 --version
          python3 -m unittest discover -s motore -t . -p 'test_*.py' -v

      - name: Acquisisci i prezzi dal MIMIT
        id: dati
        continue-on-error: true
        run: python3 -m motore.aggiorna --json data/prezzi.json

      - name: Archivia i dati nel repository
        run: |
          if git diff --quiet -- data/prezzi.json; then
            echo "Nessun dato nuovo da archiviare."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prezzi.json
          git commit -m "Prezzi del $(TZ=Europe/Rome date +%d/%m/%Y)"
          git pull --rebase --autostash
          git push

      - name: Prepara la cartella del sito
        run: |
          mkdir -p _site
          cp -r index.html sw.js manifest.webmanifest icone data _site/

      - name: Carica il sito
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Pubblica su GitHub Pages
        id: pubblica
        uses: actions/deploy-pages@v4

      - name: Segnala un'acquisizione non riuscita
        if: steps.dati.outcome == 'failure'
        run: |
          echo "::error::Nessuna fonte MIMIT disponibile: il sito mostra l'ultimo dato archiviato."
          exit 1
