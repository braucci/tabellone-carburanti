# Tabellone Carburanti — pubblicazione su GitHub Pages.
#
# I dati li scrive il Mac (strumenti/macos/installa.sh) con un commit su
# data/prezzi.json: ogni commit sul ramo main fa ripartire questo workflow,
# che prova il motore, controlla i dati e rimette online il sito.
# La lettura dal MIMIT non avviene qui: il sito del Ministero non risponde
# ai server di GitHub (verificato il 19/10/2026: robots.txt in timeout).
#
# Autore: Biagio Raucci — Licenza MIT.

name: Pubblica tabellone

on:
  push:
    branches: [main]
  workflow_dispatch:        # pulsante "Run workflow" nella scheda Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tabellone
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pubblica.outputs.page_url }}
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v5

      - name: Prova il motore
        run: |
          python3 --version
          python3 -m unittest discover -s motore -t . -p 'test_*.py' -v

      - name: Controlla i dati da pubblicare
        run: |
          python3 -c "import json; from motore import core; d = json.load(open('data/prezzi.json', encoding='utf-8')); core.controlla_invarianti(d); print('Rilevazione pubblicata:', d['rilevazione'])"

      - name: Prepara la cartella del sito
        run: |
          mkdir -p _site
          cp -r index.html sw.js manifest.webmanifest icone data _site/

      - name: Carica il sito
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Pubblica su GitHub Pages
        id: pubblica
        uses: actions/deploy-pages@v4
